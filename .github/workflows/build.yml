name: Build AyuGram with TG-WS Proxy

on:
  push:
    branches: [rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xss16m
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform 33, build-tools and NDKs
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529" "ndk;26.3.11579264"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare signing keystore and API keys
        run: |
          PASS="AyuGramTGWS2026"
          # 固定签名：从 secret 还原 keystore，保证每次构建签名一致、可覆盖安装
          echo "${{ secrets.EXTERA_KEYSTORE_B64 }}" | base64 -d > TMessagesProj/config/extera.jks
          cat > API_KEYS <<EOF2
          APP_ID=6
          APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e
          MAPS_V2_API=AIzaSyDUMMY_KEY_123456
          SIGNING_KEY_STORE_PASSWORD=$PASS
          SIGNING_KEY_ALIAS=ayugram
          SIGNING_KEY_PASSWORD=$PASS
          EOF2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust proxy core (libtgwsproxy.so)
        run: |
          cd TMessagesProj/tgwsproxy
          CARGO_BUILD_JOBS=2 cargo ndk -t arm64-v8a --platform 24 -o ../jniLibs build --release

      - name: Build arm64 debug APK
        run: |
          ./gradlew :TMessagesProj:assembleArm64Debug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-tgwsproxy-debug
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
